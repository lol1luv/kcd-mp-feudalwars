<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feudal Wars</title>
<link rel="stylesheet" href="../feudalwars.css">
</head>
<body>
<section class="window menu" aria-label="Menu">
  <header>
    <div class="crest">⚔</div>
    <h1 id="title">Feudal Wars</h1>
    <button class="close" id="close" type="button" aria-label="Close">&times;</button>
  </header>
  <div id="body">
    <p class="lead" id="keys"></p>
    <p class="lead" id="mouse-line"><span id="mouse-text"></span> <button class="act small" id="cursor" type="button"></button></p>
    <div class="hero-buttons">
      <button class="act gold big" id="go-me" type="button"></button>
      <button class="act gold big" id="go-hall" type="button"></button>
      <button class="act gold big" id="go-admin" type="button"></button>
      <button class="act big" id="go-settings" type="button"></button>
    </div>
    <div id="panel-main">
      <table id="cmds"><thead><tr><th id="th-cmd"></th><th id="th-what"></th><th></th></tr></thead><tbody></tbody></table>
    </div>
    <div id="panel-settings" hidden>
      <h2 id="settings-title"></h2>
      <p class="lead" id="settings-lang-label"></p>
      <div class="hero-buttons">
        <button class="act gold big" id="lang-en" type="button">English</button>
        <button class="act gold big" id="lang-ru" type="button">Русский</button>
      </div>
      <div style="margin-top:12px"><button class="act" id="settings-back" type="button"></button></div>
    </div>
  </div>
  <footer>Feudal Wars &middot; Bohemia, 1403</footer>
</section>
<script src="menu.js"></script>
</body>
</html>
