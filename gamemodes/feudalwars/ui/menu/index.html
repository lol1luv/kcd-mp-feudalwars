<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feudal Wars</title>
<link rel="stylesheet" href="../feudalwars.css">
</head>
<body>
<section class="window" aria-label="Commands">
  <header>
    <h1>Feudal Wars</h1>
    <button class="close" id="close" type="button" aria-label="Close">&times;</button>
  </header>
  <div id="body">
    <p class="lead">Keys: E work where you stand, F collect the shift, F2 this menu, Esc close. If the mouse is stuck in the look-around, press the button:</p>
    <div style="margin-bottom:12px">
      <button class="act" id="cursor" type="button">Free the mouse</button>
    </div>
    <div style="margin-bottom:12px">
      <button class="act gold" id="go-me" type="button">Character (F2)</button>
      <button class="act gold" id="go-hall" type="button">House hall</button>
      <button class="act gold" id="go-admin" type="button">Crown's console</button>
    </div>
    <table id="cmds"><thead><tr><th>Command</th><th>What it does</th><th></th></tr></thead><tbody></tbody></table>
  </div>
  <footer>Feudal Wars &middot; Bohemia, 1403</footer>
</section>
<script src="menu.js"></script>
</body>
</html>
