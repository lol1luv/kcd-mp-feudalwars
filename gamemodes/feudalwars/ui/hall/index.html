<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feudal Wars</title>
<link rel="stylesheet" href="../feudalwars.css">
</head>
<body>
<section class="window" aria-label="The house hall">
  <header>
    <h1 id="title">The House Hall</h1>
    <nav id="tabs" role="tablist">
      <button type="button" role="tab" data-tab="roster" aria-selected="true">Roster</button>
      <button type="button" role="tab" data-tab="treasury" aria-selected="false">Treasury</button>
      <button type="button" role="tab" data-tab="wars" aria-selected="false">Wars</button>
    </nav>
    <button class="close" id="close" type="button" aria-label="Close">&times;</button>
  </header>
  <div id="body">
    <div data-panel="roster">
      <p class="lead">Retainers of the house. The lord leads; the steward keeps the purse.</p>
      <table id="members"><thead><tr><th>Name</th><th>Rank</th><th>Status</th></tr></thead><tbody></tbody></table>
      <div style="margin-top:12px">
        <button class="act" id="promote">Raise to steward</button>
        <button class="act" id="demote">Return to retainer</button>
        <button class="act" id="kick">Cast out</button>
      </div>
    </div>
    <div data-panel="treasury" hidden>
      <p class="lead">The house's purse. Taxes flow in; the upkeep of every retainer flows out.</p>
      <dl id="purse"></dl>
      <div style="margin-top:12px">
        <button class="act gold" id="donate">Donate 100 groschen</button>
        <button class="act gold" id="prestige">Raise prestige (10 000)</button>
      </div>
    </div>
    <div data-panel="wars" hidden>
      <p class="lead">Declarations of war cost the treasury 5 000 groschen. Wins take the spoils.</p>
      <table id="warlist"><thead><tr><th>Enemy</th><th>Score</th><th>Since</th></tr></thead><tbody></tbody></table>
      <div style="margin-top:12px">
        <input type="text" id="enemyName" placeholder="house name" style="width:200px">
        <button class="act" id="declare">Declare war</button>
        <button class="act" id="peace">Sue for peace</button>
      </div>
    </div>
  </div>
  <footer>The house hall &middot; Feudal Wars</footer>
</section>
<script src="hall.js"></script>
</body>
</html>
