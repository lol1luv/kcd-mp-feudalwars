<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feudal Wars</title>
<link rel="stylesheet" href="../feudalwars.css">
</head>
<body>
<section class="window parchment" aria-label="House hall">
  <header>
    <div class="crest">♛</div>
    <h1 id="title">House hall</h1>
    <nav id="tabs" role="tablist">
      <button type="button" role="tab" data-tab="roster" aria-selected="true" id="tab-roster"></button>
      <button type="button" role="tab" data-tab="treasury" aria-selected="false" id="tab-treasury"></button>
      <button type="button" role="tab" data-tab="wars" aria-selected="false" id="tab-wars"></button>
    </nav>
    <button class="close" id="close" type="button" aria-label="Close">&times;</button>
  </header>
  <div id="body">
    <div data-panel="roster">
      <p class="lead" id="roster-lead"></p>
      <table id="members"><thead><tr><th id="th-name"></th><th id="th-rank"></th><th id="th-status"></th></tr></thead><tbody></tbody></table>
    </div>
    <div data-panel="treasury" hidden>
      <p class="lead" id="treasury-lead"></p>
      <dl id="purse"></dl>
      <div style="margin-top:12px">
        <button class="act gold" id="donate"></button>
        <button class="act gold" id="prestige"></button>
      </div>
    </div>
    <div data-panel="wars" hidden>
      <p class="lead" id="wars-lead"></p>
      <table id="warlist"><thead><tr><th id="th-enemy"></th><th id="th-score"></th><th id="th-since"></th></tr></thead><tbody></tbody></table>
      <div style="margin-top:12px">
        <input type="text" id="enemyName" style="width:200px">
        <button class="act" id="declare"></button>
        <button class="act" id="peace"></button>
      </div>
    </div>
  </div>
  <footer>Feudal Wars &middot; Bohemia, 1403</footer>
</section>
<script src="hall.js"></script>
</body>
</html>
