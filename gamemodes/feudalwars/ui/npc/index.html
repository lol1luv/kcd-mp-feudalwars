<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feudal Wars</title>
<link rel="stylesheet" href="../feudalwars.css">
</head>
<body>
<section class="window parchment" aria-label="NPC">
  <header>
    <div class="crest">👤</div>
    <h1 id="title">People of the realm</h1>
    <button class="close" id="close" type="button" aria-label="Close">&times;</button>
  </header>
  <div id="body">
    <p class="lead" id="lead"></p>

    <div id="single-block" hidden>
      <div class="seal-line"><span id="single-role"></span></div>
      <div class="hero-buttons" id="single-actions"></div>
      <h2 id="single-stock-h" hidden>Offers</h2>
      <table id="single-stock"><tbody></tbody></table>
    </div>

    <div id="admin-block">
      <table id="npcs"><thead><tr><th>#</th><th id="th-name"></th><th id="th-role"></th><th id="th-place"></th><th id="th-stock"></th><th></th></tr></thead><tbody></tbody></table>
      <h2 id="stock-h" hidden></h2>
      <div id="stock-box" hidden>
        <p class="lead" id="stock-lead"></p>
        <div class="hero-buttons" id="item-buttons"></div>
      </div>
    </div>
  </div>
  <footer>Feudal Wars &middot; Bohemia, 1403</footer>
</section>
<script src="npc.js"></script>
</body>
</html>
