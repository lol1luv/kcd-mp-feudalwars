<html lang="en">
<head>

<title>Feudal Wars</title>

<body>
<section class="window" aria-label="The admin console">
  <header>
    <h1>The Crown's Console</h1>
    <button class="close" id="close" type="button" aria-label="Close">&times;</button>
  </header>
  <div id="body">
    <p class="lead">Souls in the realm. Actions land at once; the log below keeps the tale.</p>
    <table id="players"><thead><tr><th>ID</th><th>Name</th><th>House</th><th>Purse</th><th>Ping</th><th>Actions</th></tr></thead><tbody></tbody></table>
    <div style="margin-top:14px" id="log"></div>
  </div>
  <footer>Feudal Wars &middot; admin console</footer>
</section>
<script src="admin.js"></script>
</body>
